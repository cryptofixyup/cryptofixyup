name: JEV JNI benchmark harness

on:
  push:
    paths:
      - 'samples/jev-jni-benchmark-harness/**'
      - '.github/workflows/jev-jni-benchmark.yml'
  pull_request:
    paths:
      - 'samples/jev-jni-benchmark-harness/**'
      - '.github/workflows/jev-jni-benchmark.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure native library
        run: cmake -S samples/jev-jni-benchmark-harness -B samples/jev-jni-benchmark-harness/build/native -DCMAKE_BUILD_TYPE=Release
      - name: Compile native library
        run: cmake --build samples/jev-jni-benchmark-harness/build/native --config Release --parallel 2
      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p samples/jev-jni-benchmark-harness/build/classes
          find samples/jev-jni-benchmark-harness/java -name '*.java' -print0 \
            | xargs -0 javac -Xlint:all -Werror -d samples/jev-jni-benchmark-harness/build/classes
      - name: Run smoke benchmark
        run: >-
          java
          -Djava.library.path=samples/jev-jni-benchmark-harness/build/native
          -cp samples/jev-jni-benchmark-harness/build/classes
          com.jev.BenchmarkMain 100 10 5
